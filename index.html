<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRONUX - Esports & Gaming Community</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        cronuxGreen: '#00ff66',
                        cronuxDark: '#0a0f0d',
                        cronuxCard: '#121a16'
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Custom Styles -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-cronuxDark text-white font-sans antialiased min-h-screen flex flex-col items-center justify-center overflow-x-hidden">

    <!-- Splash Screen -->
    <div id="splash-screen" class="fixed inset-0 z-50 bg-cronuxDark flex flex-col items-center justify-center transition-opacity duration-500">
        <div class="relative w-24 h-24 mb-6">
            <div class="absolute inset-0 rounded-full border-2 border-cronuxGreen/20 animate-ping"></div>
            <div class="absolute inset-0 rounded-full border-2 border-cronuxGreen border-t-transparent animate-spin"></div>
            <img src="logoapp.png.jpg" alt="CRONUX Logo" class="w-full h-full object-cover rounded-full p-1">
        </div>
        <h1 class="text-2xl font-black tracking-widest text-cronuxGreen uppercase">CRONUX</h1>
        <p class="text-xs text-zinc-400 italic mt-1">"Cronux doesn't follow, Cronux leads."</p>
        <div class="w-48 h-1 bg-white/10 rounded-full mt-8 overflow-hidden">
            <div class="h-full bg-cronuxGreen animate-pulse w-3/4"></div>
        </div>
        <span class="text-[10px] text-zinc-500 mt-2 font-mono uppercase tracking-wider">Initializing Systems...</span>
    </div>

    <!-- Cyber Auth Animation Overlay -->
    <div id="cyber-auth-overlay" class="fixed inset-0 z-40 bg-black/80 backdrop-blur-md flex flex-col items-center justify-center hidden opacity-0 transition-opacity duration-300">
        <div class="p-6 rounded-2xl liquid-glass-card max-w-xs w-full text-center space-y-4 border border-cronuxGreen/40">
            <div class="w-12 h-12 mx-auto rounded-full bg-cronuxGreen/20 border border-cronuxGreen flex items-center justify-center text-cronuxGreen text-lg animate-spin">
                <i class="fa-solid fa-microchip"></i>
            </div>
            <div>
                <h3 id="cyber-auth-title" class="text-sm font-black text-white uppercase tracking-wider">ESTABLISHING LINK...</h3>
                <p id="cyber-auth-sub" class="text-[10px] text-zinc-400 mt-1">Please wait while we sync nodes</p>
            </div>
            <div class="w-full h-1.5 bg-black/60 rounded-full overflow-hidden border border-white/10">
                <div id="cyber-progress-bar" class="h-full bg-cronuxGreen w-0 transition-all duration-300"></div>
            </div>
        </div>
    </div>

    <!-- App Container -->
    <div id="app-container" class="w-full max-w-md min-h-screen flex flex-col justify-between p-4 opacity-0 pointer-events-none transition-opacity duration-500 pb-20">
        <!-- Header -->
        <header class="flex items-center justify-between py-3 border-b border-white/10 mb-4">
            <div class="flex items-center space-x-2.5">
                <img src="logoapp.png.jpg" class="w-8 h-8 rounded-full object-cover border border-cronuxGreen/50">
                <span class="font-black tracking-wider text-sm text-white">CRONUX</span>
            </div>
            <button id="logout-btn" onclick="triggerCyberLogout()" class="hidden px-3 py-1 bg-red-500/10 border border-red-500/30 text-red-400 rounded-lg text-xs font-bold hover:bg-red-500/20 transition">
                <i class="fa-solid fa-power-off mr-1"></i> Logout
            </button>
        </header>

        <!-- Main Dynamic Content Area -->
        <main id="main-content" class="flex-1 overflow-y-auto"></main>

        <!-- Bottom Navigation Bar -->
        <nav id="bottom-nav" class="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-cronuxCard/90 backdrop-blur-lg border-t border-white/10 px-6 py-3 flex justify-between items-center z-30 hidden">
            <button onclick="switchTab('dashboard')" id="nav-dashboard" class="nav-btn flex flex-col items-center text-cronuxGreen transition scale-110">
                <i class="fa-solid fa-house text-sm"></i>
                <span class="text-[9px] mt-1 font-bold">Home</span>
            </button>
            <button onclick="switchTab('chats')" id="nav-chats" class="nav-btn flex flex-col items-center text-zinc-400 transition relative">
                <i class="fa-solid fa-comments text-sm"></i>
                <span class="text-[9px] mt-1 font-bold">Chats</span>
                <span id="global-chat-badge" class="absolute -top-1 -right-1 px-1.5 py-0.2 bg-red-500 text-white font-bold text-[8px] rounded-full hidden">0</span>
            </button>
            <button onclick="switchTab('members')" id="nav-members" class="nav-btn flex flex-col items-center text-zinc-400 transition">
                <i class="fa-solid fa-users text-sm"></i>
                <span class="text-[9px] mt-1 font-bold">Members</span>
            </button>
            <button onclick="switchTab('teams')" id="nav-teams" class="nav-btn flex flex-col items-center text-zinc-400 transition">
                <i class="fa-solid fa-shield-halved text-sm"></i>
                <span class="text-[9px] mt-1 font-bold">Teams</span>
            </button>
            <button onclick="switchTab('scrims')" id="nav-scrims" class="nav-btn flex flex-col items-center text-zinc-400 transition">
                <i class="fa-solid fa-calendar-days text-sm"></i>
                <span class="text-[9px] mt-1 font-bold">Scrims</span>
            </button>
        </nav>
    </div>

    <!-- Application JavaScript Script Link -->
    <script src="script.js"></script>
</body>
</html>
